name: Windows
on:
  pull_request:
  push:
jobs:
  test:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.3.0
      with:
        java-version: 17
        distribution: temurin
    - uses: coursier/cache-action@v9.0.1
    - uses: sbt/setup-sbt@v1.5.15
    - run: rm project/sbt-pgp.sbt
    - run: sbt -v testFull
